[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-drl-lab"
version = "0.2.0"
description = "Reproducible NumPy reinforcement learning experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4", "flask>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
report = ["python-docx>=1.1,<2"]

[project.scripts]
drl-train = "src.experiments:main"
drl-evaluate = "src.evaluate:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.data-files]
"configs" = ["configs/smoke.json", "configs/full.json", "configs/study.json", "configs/exploratory_shared_lr.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", ".build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"src/*/__init__.py" = ["F401"]
"gui.py" = ["E402"]
